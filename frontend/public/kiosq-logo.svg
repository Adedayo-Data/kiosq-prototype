<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" width="100%" height="100%" fill="none">
  <!-- Definitions for ink & paper feel -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .kiosq-brand-title {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 56px;
        fill: #0A0A0A;
        letter-spacing: -2px;
      }
      .kiosq-brand-tag {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 10px;
        fill: #FFFFFF;
        letter-spacing: 2.2px;
      }
    </style>
  </defs>

  <!-- LOGO EMBLEM (Left) -->
  <g transform="translate(6, 6)">
    <!-- Outer Chat-Bubble Frame -->
    <rect x="2" y="2" width="80" height="76" rx="22" fill="#0A0A0A" />
    <!-- Speech Bubble Notch -->
    <polygon points="14,66 14,84 30,66" fill="#0A0A0A" />

    <!-- Inner Clean Store Window Canvas -->
    <rect x="7" y="7" width="70" height="63" rx="17" fill="#FDFBF7" />

    <!-- Kiosk Awning / Shop Canopy -->
    <path d="M14 24 C23 19 61 19 70 24 L72 40 C67 43 63 41 58 39 C53 37 49 37 42 39 C35 41 31 43 26 40 C21 38 17 40 12 40 Z" fill="#0A0A0A" />

    <!-- Awning Stripes -->
    <path d="M21 22 L22 39" stroke="#FDFBF7" stroke-width="2.8" stroke-linecap="round" />
    <path d="M35 20 L36 38" stroke="#FDFBF7" stroke-width="3" stroke-linecap="round" />
    <path d="M49 20 L49 38" stroke="#FDFBF7" stroke-width="3" stroke-linecap="round" />
    <path d="M63 22 L62 39" stroke="#FDFBF7" stroke-width="2.8" stroke-linecap="round" />

    <!-- Kiosk Counter Posts -->
    <line x1="20" y1="40" x2="20" y2="53" stroke="#0A0A0A" stroke-width="3" stroke-linecap="round" />
    <line x1="64" y1="40" x2="64" y2="53" stroke="#0A0A0A" stroke-width="3" stroke-linecap="round" />

    <!-- Kiosk Counter Shelf -->
    <rect x="15" y="52" width="54" height="4.5" rx="2.25" fill="#0A0A0A" />

    <!-- Escrow Green Badge -->
    <circle cx="42" cy="46" r="6.5" fill="#16A34A" />
    <path d="M39 46 L41 48 L45 44" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- WORDMARK: Kiosq & Tagline -->
  <g transform="translate(108, 62)">
    <text x="0" y="0" class="kiosq-brand-title">Kiosq</text>

    <!-- Emerald square badge on the 'q' -->
    <rect x="150" y="-45" width="10" height="10" rx="3" fill="#16A34A" />

    <!-- Tagline Pill: CHAT • COMMERCE -->
    <g transform="translate(2, 14)">
      <rect x="0" y="-12" width="170" height="20" rx="10" fill="#0A0A0A" />
      <text x="14" y="2" class="kiosq-brand-tag">CHAT • COMMERCE</text>
      <!-- Escrow indicator dot -->
      <circle cx="152" cy="-2" r="3" fill="#16A34A" />
    </g>
  </g>
</svg>
